# Standalone deployment on a Linux Docker host.
# Deploy with: docker compose up -d --build
#
# Publishes to 127.0.0.1 only; put a Cloudflare tunnel (or another reverse proxy) in
# front. Host port 3006: 3001-3005 are taken on dockerhost1 (pool uses 3005).
services:
  app:
    build: .
    container_name: menu-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:3005"
    environment:
      PORT: "3005"
      DATA_DIR: /data
      GAME_NAME: "${GAME_NAME:-}"
      # Leave unset to use the /admin first-run setup screen.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # Server time zone; only the fallback when neither the admin's setting nor the
      # weather location gives one.
      TZ: "${TZ:-America/New_York}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      # Admin password hash, settings and uploaded slides survive rebuilds.
      # The image runs as uid 1000: `sudo chown -R 1000:1000 ./data` if root created it.
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
